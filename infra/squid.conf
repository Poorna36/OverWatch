# Egress proxy scaffold configuration for Phase 0
# NOTE: This is a static scaffold configuration for early development.
# Dynamic per-session/per-profile allowlist generation will be implemented in Phase 1 (Sandbox).
# Restrictive by default: deny all requests unless explicitly allowed

http_port 3128

# Access control lists for private networks
acl localnet src 10.0.0.0/8
acl localnet src 172.16.0.0/12
acl localnet src 192.168.0.0/16
acl localnet src fc00::/7
acl localnet src fe80::/10

acl SSL_ports port 443
acl Safe_ports port 80          # http
acl Safe_ports port 443         # https
acl CONNECT method CONNECT

# Deny requests to unsafe ports
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports

# Dynamic per-session egress allowlist policies generated by control plane
# Each session ACL block allows only that session's source IP to reach its profile domains,
# ending with an explicit deny for that source IP to prevent cross-session access.
include /etc/squid/conf.d/sessions.conf

# Deny all other access by default (default deny)
http_access deny all

# Fast shutdown for clean reloads and container stops
shutdown_lifetime 1 seconds

# Logging
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
