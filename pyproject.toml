[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "overwatch"
version = "0.1.0"
description = "MCP Pocket Computer: control plane and gateway"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "docker>=7.0.0",
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
    "openai>=3.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
    "black>=24.0.0",
]

[tool.setuptools]
package-dir = {"control_plane" = "control-plane"}
packages = [
    "control_plane",
    "control_plane.api",
    "control_plane.agent",
    "control_plane.db",
    "control_plane.gateway",
    "control_plane.sessions",
    "control_plane.vault",
    "control_plane.audit",
    "control_plane.events",
]

[tool.pytest.ini_options]
pythonpath = ["control-plane", "."]
testpaths = ["tests"]

[tool.black]
line-length = 88
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
