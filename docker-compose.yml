services:
  control-plane:
    build:
      context: .
      dockerfile: control-plane/Dockerfile
    container_name: overwatch-control-plane
    command: ["uvicorn", "control_plane.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - APP_TOKEN=${APP_TOKEN}
      - VAULT_KEY=${VAULT_KEY}
      - LLM_API_KEY=${LLM_API_KEY}
      - DATABASE_URL=sqlite:////app/data/overwatch.db
      - OVERWATCH_SQUID_ACL_PATH=/app/squid-config/sessions.conf
      - HTTP_PROXY=http://egress-proxy:3128
      - HTTPS_PROXY=http://egress-proxy:3128
      # Docker Engine connection for session container management.
      # The host Docker socket (/var/run/docker.sock) is intentionally NEVER mounted.
      # Compose deployments connect to a remote/host Docker Engine over verified TLS:
      #   - DOCKER_HOST defaults to a TLS endpoint (set tcp://<host>:2376 in .env)
      #   - DOCKER_TLS_VERIFY is pinned to 1 (verification cannot be disabled)
      #   - DOCKER_CERT_PATH matches the read-only mount target below
      # Place ca.pem, cert.pem, and key.pem in DOCKER_TLS_CERT_DIR on the host.
      # Note: TLS authenticates and encrypts the connection but does not restrict
      # Docker API permissions; restrict the daemon to trusted control-plane use.
      - DOCKER_HOST=${DOCKER_HOST:-tcp://host.docker.internal:2376}
      - DOCKER_TLS_VERIFY=1
      - DOCKER_CERT_PATH=/etc/overwatch/docker-tls
    volumes:
      - overwatch-data:/app/data
      - squid-config:/app/squid-config
      # Read-only mount of host-provided Docker TLS certificates (ca.pem, cert.pem, key.pem)
      - ${DOCKER_TLS_CERT_DIR:-/etc/overwatch/docker-tls}:/etc/overwatch/docker-tls:ro
    networks:
      - mgmt
    depends_on:
      - egress-proxy
    restart: unless-stopped

  squid-init:
    image: ubuntu/squid:5.2-22.04_beta
    container_name: overwatch-squid-init
    volumes:
      - squid-config:/etc/squid/conf.d
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /etc/squid/conf.d/sessions.conf ]; then
          echo "# Overwatch Squid Dynamic Session ACLs - No active sessions" > /etc/squid/conf.d/sessions.conf
          echo "[squid-init] Created initial sessions.conf"
        else
          echo "[squid-init] sessions.conf already exists, preserving policy"
        fi
    restart: "no"

  egress-proxy:
    image: ubuntu/squid:5.2-22.04_beta
    container_name: overwatch-egress-proxy
    entrypoint: ["/entrypoint.sh"]
    volumes:
      - ./infra/squid.conf:/etc/squid/squid.conf:ro
      - ./infra/entrypoint.sh:/entrypoint.sh:ro
      - squid-config:/etc/squid/conf.d:ro
    networks:
      - mgmt
    depends_on:
      squid-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  overwatch-data:
    name: overwatch-data
  squid-config:
    name: overwatch-squid-config

networks:
  mgmt:
    name: overwatch-mgmt
    driver: bridge
